services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: class_tasks
    ports:
      - "5433:5432"
    volumes:
      - class_task_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d class_tasks"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  class_task_db:
